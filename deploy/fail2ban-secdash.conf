# /etc/fail2ban/jail.d/secdash.conf
# 대시보드 권장 fail2ban 보강. jail.local 의 값은 유지되고 여기 정의만 덮어쓴다.

[DEFAULT]
# 관리자 IP 는 절대 차단하지 않는다. 사무실/VPN 대역을 추가하세요 (공백 구분).
ignoreip = 127.0.0.1/8 ::1
# 재범 IP 는 차단 시간을 배로 늘린다 (1h → 2h → 4h … 최대 1주)
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 1w
bantime.rndtime = 10m

[sshd]
enabled = true
# 키 인증만 쓰는 서버라면 mode = aggressive 로 preauth 단계 실패까지 집계
mode = normal

[recidive]
# fail2ban 로그를 보고, 하루에 3번 이상 차단된 IP 를 1주 차단
enabled = true
logpath = /var/log/fail2ban.log
bantime = 1w
findtime = 1d
maxretry = 3
