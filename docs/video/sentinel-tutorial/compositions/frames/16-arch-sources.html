          <div style="position:absolute;left:0px;top:860px;width:1920px;height:220px;background:#17221d;"></div>

          <div id="f16-arch-src-sub2" style="position:absolute;left:150px;top:893px;width:1620px;height:153px;font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:34px;color:#ffffff;line-height:1.5;word-break:keep-all;opacity:0;will-change:opacity;">오른쪽 끝 점선 상자만 이 컴퓨터 바깥, 인터넷에 있는 것입니다. 우분투 보안 공지와 보안 뉴스를 한 시간에 한 번 읽어옵니다. 이 상자에서는 읽어오기만 하고, 이쪽에서 보내는 것은 없습니다.</div>
