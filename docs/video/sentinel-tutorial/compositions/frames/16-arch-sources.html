          <div data-hf-id="hf-wxci" id="f16-arch-src-e56" style="position:absolute;left:150px;top:716px;width:760px;height:34px;font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:21px;font-weight:400;color:#5c6b64;line-height:1.5;text-align:left;word-break:keep-all;will-change:transform,opacity;">일어난 일. 심각도 없음. 근거로 남는다.</div>

          <div data-hf-id="hf-ii3f" id="f16-arch-src-e58" style="position:absolute;left:1010px;top:716px;width:760px;height:34px;font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:21px;font-weight:400;color:#5c6b64;line-height:1.5;text-align:left;word-break:keep-all;will-change:transform,opacity;">묶어서 내린 결론. 사람의 시간을 요구한다.</div>
          <div data-hf-id="hf-osxi" style="position:absolute;left:0px;top:860px;width:1920px;height:220px;background:#17221d;"></div>
          <div data-hf-id="hf-ojem" id="f16-arch-src-sub0" style="position:absolute;left:150px;top:944px;width:1620px;height:51px;font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:34px;color:#ffffff;line-height:1.5;word-break:keep-all;opacity:0;will-change:opacity;">아키텍처를 보겠습니다. 데이터는 위에서 아래로만 흐릅니다.</div>
          <div data-hf-id="hf-m1qs" id="f16-arch-src-sub1" style="position:absolute;left:150px;top:893px;width:1620px;height:153px;font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:34px;color:#ffffff;line-height:1.5;word-break:keep-all;opacity:0;will-change:opacity;">맨 위가 진실의 원천입니다. rsyslog가 남기는 auth.log와 auditd의 audit.log, dpkg와 apt, /proc, /etc와 cron과 systemd, 그리고 fail2ban. 전부 root가 소유한 데몬과 로그입니다. 지킴이가 만든 것은 하나도 없습니다.</div>
          <div data-hf-id="hf-bm7z" id="f16-arch-src-sub2" style="position:absolute;left:150px;top:919px;width:1620px;height:102px;font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:34px;color:#ffffff;line-height:1.5;word-break:keep-all;opacity:0;will-change:opacity;">오른쪽 끝 점선 상자만 인터넷 밖입니다. 우분투 보안 공지와 뉴스를 한 시간에 한 번 읽어옵니다. 읽기만 하고 아무것도 보내지 않습니다.</div>
          <div data-hf-id="hf-07jy" id="f16-arch-src-sub3" style="position:absolute;left:150px;top:919px;width:1620px;height:102px;font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:34px;color:#ffffff;line-height:1.5;word-break:keep-all;opacity:0;will-change:opacity;">그 아래가 모니터 열한 개입니다. 각자 자기 원천을 읽습니다. 로그는 따라 읽고, 프로세스는 15초에서 30초마다 표본을 뜨고, 파일 해시는 60초마다 비교합니다.</div>
          <div data-hf-id="hf-idx0" id="f16-arch-src-sub4" style="position:absolute;left:150px;top:893px;width:1620px;height:153px;font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:34px;color:#ffffff;line-height:1.5;word-break:keep-all;opacity:0;will-change:opacity;">모니터가 하는 일은 두 가지뿐입니다. 일어난 일은 이벤트로 남기고, 그것을 묶어 내린 판단은 알림으로 올립니다. 이 둘을 섞지 않는 것이 이 구조의 첫 번째 규칙입니다.</div>
