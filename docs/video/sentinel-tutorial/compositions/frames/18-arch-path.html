          <div id="f18-arch-path-sub0" style="position:absolute;left:150px;top:893px;width:1620px;height:153px;font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:34px;color:#ffffff;line-height:1.5;word-break:keep-all;opacity:0;will-change:opacity;">이번에는 사건 하나가 이 구조를 어떻게 지나가는지 따라가 보겠습니다. 예로 들 사건은, 원격 접속으로 비밀번호를 계속 바꿔가며 찍어보는 공격, 흔히 브루트포스라고 부르는 공격입니다.</div>
